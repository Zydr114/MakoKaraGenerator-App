<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MakoKara · 三工作区交互原型</title>
<style>
:root{color-scheme:light;--bg:#f4f5f8;--surface:#fff;--text:#202431;--muted:#677082;--edge:#dfe4ee;--accent:#365ecc;--soft:#eaf0ff;--action:36px;--compact:32px;--panel:360px;--library:240px}
*{box-sizing:border-box}body{margin:0;font:14px/1.6 system-ui,'Noto Sans CJK SC',sans-serif;color:var(--text);background:var(--bg)}body.dark{color-scheme:dark;--bg:#171a22;--surface:#222833;--text:#e8edf7;--muted:#a8b2c6;--edge:#394254;--accent:#9bb8ff;--soft:#2a395e}
button,input,select,textarea{font:inherit;color:inherit}button,input,select{height:var(--action);min-height:var(--action);flex-shrink:0;padding:0 12px;border:1px solid var(--edge);border-radius:7px;background:var(--surface)}button{cursor:pointer;white-space:nowrap}button:hover,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}button.compact{height:var(--compact);min-height:var(--compact);padding:0 10px;font-size:13px}.primary,.active{background:var(--soft);border-color:var(--accent)}textarea{border:1px solid var(--edge);border-radius:7px;background:var(--surface);padding:10px;width:100%;resize:vertical}h1,h2,h3,p{margin:0}h1{font-size:28px}h2{font-size:20px}h3{font-size:16px}small,.muted{color:var(--muted)}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.spread{justify-content:space-between}.stack{display:flex;flex-direction:column;gap:12px}.bar{padding:10px 16px;border-bottom:1px solid var(--edge);background:var(--surface)}.badge{background:var(--soft);border-radius:5px;padding:3px 8px}.card{padding:16px;border:1px solid var(--edge);border-radius:10px;background:var(--surface);min-width:0}.hidden{display:none!important}.demo{height:44px;font-size:12px;padding:6px 16px}.home{max-width:900px;margin:60px auto;padding:20px}.shell{height:calc(100dvh - 44px);min-height:580px;display:flex;flex-direction:column}.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(280px,1fr) var(--panel);gap:12px;padding:12px 16px;position:relative}.body.factory{grid-template-columns:var(--library) minmax(280px,1fr) var(--panel)}.body>*{overflow:auto}.library{display:none}.factory .library{display:flex}.canvas{aspect-ratio:16/9;background:#122039;color:#eef4ff;display:grid;place-content:center;text-align:center;min-height:190px;border-radius:9px}.canvas p{font-size:clamp(22px,3vw,42px)}.canvas small{color:#afc4e5}.line{padding:10px;border-bottom:1px solid var(--edge)}.line input{width:115px}.line textarea{min-height:62px}.form{display:grid;grid-template-columns:85px minmax(0,1fr);gap:10px;align-items:center}.form>*{min-width:0}.tree{padding:12px;border:1px solid var(--edge);border-radius:8px}.wave{height:66px;background:repeating-linear-gradient(90deg,var(--soft) 0 3px,var(--surface) 3px 8px);border:1px solid var(--edge);border-radius:7px;margin:8px 16px}.transport input{flex:1;min-width:120px}.status{font-size:12px;padding:6px 16px;color:var(--muted)}.pane-button{display:none}.scriptcode{font-family:monospace;min-height:160px}dialog{width:min(480px,92vw);background:var(--surface);color:var(--text);border:1px solid var(--edge);border-radius:12px;padding:24px}dialog::backdrop{background:#10162488}
@media(max-width:1099px){.body,.body.factory{grid-template-columns:minmax(280px,1fr)}.body .panel,.body.factory .library{display:none}.pane-button{display:inline-block}.body .panel.open,.body.factory .library.open{display:flex;position:absolute;right:16px;top:12px;bottom:12px;width:min(var(--panel),calc(100% - 32px));z-index:2;box-shadow:0 12px 40px #10162444}.body.factory .library.open{left:16px;right:auto;width:min(var(--library),calc(100% - 32px))}}
@media(max-width:760px){.bar{padding:8px}.body{padding:8px}.home{margin:24px auto}.form{grid-template-columns:72px minmax(0,1fr)}}
</style>
</head>
<body>
<div class="demo row spread"><span>交互原型 · 演示职责与流程，不执行渲染、不读写真实工程</span><button class="compact" id="theme">深／浅主题</button></div>
<section id="home" class="home card stack"><h1>开始制作</h1><p class="muted">先准备文本和时间，在工坊制作预设，再编排成片。</p><div class="row"><button class="primary" id="new">新建演示工程</button><button id="home-factory">模板制作</button></div><h3>最近工程</h3><button id="recent">演示工程 · 只读模拟记录</button></section>
<section id="shell" class="shell hidden">
<header class="bar row spread"><div class="row"><button id="back">首页</button><strong id="project-label">未打开工程</strong><span id="save-status" class="badge">已保存</span></div><div class="row"><button id="save">保存工程</button><button id="export">导出成片</button></div></header>
<nav class="bar row"><button data-task="lyrics">歌词与时间</button><button data-task="factory">模板制作</button><button data-task="appearance">画面与样式</button><button id="library-button" class="pane-button">预设库</button><button id="panel-button" class="pane-button">歌词来源</button></nav>
<div id="body" class="body"><aside id="library" class="library card stack"></aside><main id="central" class="card stack"></main><aside id="panel" class="panel card stack"></aside></div>
<div id="project-player"><div class="bar transport row"><button id="play">播放</button><span id="time">00:00.000</span><input aria-label="工程播放位置" id="seek" type="range" min="0" max="12" step=".01" value="0"><button id="loop">循环选区</button></div><div class="wave" aria-label="演示波形"></div></div>
<footer class="status" id="status">选择任务开始</footer>
</section>
<dialog id="dialog"><div id="dialog-body" class="stack"></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);
const labels={lyrics:'歌词与时间',factory:'模板制作',appearance:'画面与样式'};
let task='lyrics',project=false,advanced=false,playing=false,time=0,templatePlaying=false,templateTime=1.5,dirty=false;
let libraryPreset={name:'经典歌词 + 逐字强调',revision:1},applied=null,draftName=null;
const lines=[{text:'光を追いかけて',start:2,end:5},{text:'遠いあの場所へ',start:7,end:10}];
const feedback=text=>{$('status').textContent=text;};
function dialog(html){$('dialog-body').innerHTML=html;$('dialog').showModal();}
function closeDialog(){$('dialog').close();}
function enter(next){$('home').classList.add('hidden');$('shell').classList.remove('hidden');navigate(next);}
function startProject(){project=true;$('project-label').textContent='演示工程';enter('lyrics');}
function navigate(next){if(next!=='factory'&&!project){feedback('请先新建或打开工程');return;}if(next!=='factory')templatePlaying=false;else playing=false;task=next;document.querySelectorAll('[data-task]').forEach(b=>{b.classList.toggle('active',b.dataset.task===task);b.disabled=!project&&b.dataset.task!=='factory';});$('body').classList.toggle('factory',task==='factory');$('project-player').classList.toggle('hidden',task==='factory');$('export').classList.toggle('hidden',task==='factory');$('save').textContent=task==='factory'?'保存预设':'保存工程';$('save-status').textContent=task==='factory'?(dirty?'预设草稿':'预设已保存'):'工程固定快照';$('library-button').classList.toggle('hidden',task!=='factory');$('panel-button').textContent=task==='lyrics'?'歌词来源':task==='factory'?'样式编辑':advanced?'布局':'应用对象';$('panel').classList.remove('open');$('library').classList.remove('open');render();}
function render(){
if(task==='lyrics'){
$('central').innerHTML='<div class="row spread"><h2>歌词与时间</h2><div class="row"><button data-action="import">导入／粘贴</button><button data-action="lrc">导出歌词</button></div></div><div class="canvas"><p id="neutral">···</p><small>中性预览 · 不读取样式与脚本</small></div>'+lines.map((line,i)=>'<div class="line stack"><textarea data-line="'+i+'" aria-label="第'+(i+1)+'行文本">'+line.text+'</textarea><div class="row"><label>起点 <input type="number" step=".01" data-start="'+i+'" value="'+line.start+'"></label><label>终点 <input type="number" step=".01" data-end="'+i+'" value="'+line.end+'"></label><span class="badge">已校正</span></div><details><summary>逐字时间、注音与翻译</summary><p>按字素拆分／合并，编辑每个字的起止时间；缺失时间保持未定时。</p><button class="compact" data-action="micro">−10ms／＋10ms</button></details></div>').join('');
$('panel').innerHTML='<h3>歌词来源</h3><select aria-label="歌词来源"><option>主歌词</option><option>翻译</option></select><button data-action="audio">导入音频</button><details><summary>关联和时间跟随</summary><p>来源关联与文本信息；没有样式或效果入口。</p></details>';updateTime();
}else if(task==='factory'){
$('library').innerHTML='<h3>预设库</h3><button data-action="template-new">新建组合预设</button><button class="active">经典歌词 + 逐字强调</button><button>玻璃歌词</button><button data-action="transfer">导入／分享 .mktpl</button>';
$('central').innerHTML='<div class="row spread"><h2>模板制作</h2><span class="badge">固定试样 · 与歌曲无关</span></div><div class="canvas"><p id="template-preview">模 板 预 览</p><small id="template-time">工坊试样：1.50 秒</small></div><div class="row"><button id="template-play">'+(templatePlaying?'暂停':'试播')+'</button><button data-action="template-restart">重播</button><span class="badge">循环试播</span></div><p class="muted">单行逐字／注音、多行重复词／间奏、标记和测试背景／音频</p>';
$('panel').innerHTML='<h3>样式编辑</h3><input aria-label="预设名称" id="preset-name" value="'+(draftName??libraryPreset.name)+'"><div class="form"><span>字体</span><select><option>Noto Sans CJK SC</option></select><span>字号</span><input value="64" type="number"><span>未唱颜色</span><input type="color" value="#eef4ff"><span>已唱颜色</span><input type="color" value="#91c6ff"></div><details open><summary>材质</summary><select aria-label="材质槽位"><option>未唱填充</option><option>已唱填充</option><option>描边</option></select><select aria-label="材质配置"><option>纯色／渐变</option><option>Glass · 固定配置快照</option></select></details><details open><summary>效果组合</summary><p>逐字强调 · 应用范围内的文字</p><button data-action="script">脚本配置库 ↗</button><button data-action="adopt">采用已保存配置</button><small>参数在独立窗口调配；工坊选择相对目标。</small></details>'; $('template-play').onclick=()=>{templatePlaying=!templatePlaying;$('template-play').textContent=templatePlaying?'暂停':'试播';};
}else{
$('central').innerHTML='<div class="row spread"><h2>画面与样式</h2><button data-action="advanced">'+(advanced?'返回简洁编排':'高级编排')+'</button></div>'+(advanced?'<p class="badge">基础编排预览 · 脚本不执行，包材质显示声明回退</p><div class="tree">歌曲布局 → 双行容器 → 槽位1／槽位2<br>设置布局 → 分配歌词段 → 时间预览</div>':'')+'<div class="canvas"><p>光を追いかけて</p><small>'+(advanced?'基础外观':'正式成片画布')+'</small></div><h3>布局预设</h3><div class="row"><button data-layout="单行居中">单行居中</button><button data-layout="卡拉 OK 双行">卡拉 OK 双行</button><button data-layout="双行居中">双行居中</button><button data-layout="三行居中">三行居中</button></div><label>范围 <select id="layout-scope"><option>整个主歌词分支</option><option>选中连续歌词段</option></select></label>';
$('panel').innerHTML=advanced?'<h3>布局 · 所选槽位</h3><div class="form"><span>X</span><input value="5%"><span>Y</span><input value="60%"><span>锚点</span><select><option>左侧中心</option></select></div><p class="badge">基础外观预览</p><small>应用记录保持完整；脚本参数在工坊编辑。</small><details><summary>片段与前奏</summary><p>设置布局，分配连续歌词段，再时间预览。稳定引用仍受保护。</p></details><button data-action="composition-apply">应用编排</button>':'<h3>应用对象</h3><select id="target"><option>整个工程</option><option>主歌词分支</option><option>选中行</option><option>选中文字</option><option>展示片段</option><option>场景节点</option></select><small>继承：上级外观与效果继续生效</small><h3>当前组合预设</h3><p id="applied">'+(applied?applied.name+' · 固定修订 '+applied.revision:'使用继承外观')+'</p><button data-action="apply">选择／替换预设</button><button data-action="remove">恢复继承</button><button data-action="update">手动更新到库内修订 '+libraryPreset.revision+'</button><button data-action="edit-copy">复制到工坊编辑</button><details><summary>画布与背景</summary>画布、帧率、背景、位置与锚点；没有字体、材质参数或源码。</details>';
}}
function updateTime(){$('time').textContent='00:'+time.toFixed(3).padStart(6,'0');$('seek').value=time;if($('neutral'))$('neutral').textContent=lines.find(line=>time>=line.start&&time<line.end)?.text??'···';}
function saveTemplate(){libraryPreset={...libraryPreset,name:draftName??libraryPreset.name,revision:libraryPreset.revision+1};dirty=false;draftName=null;navigate('factory');feedback('预设已保存；已应用工程快照不随之变化');}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.task)navigate(b.dataset.task);if(b.dataset.layout){dialog('<h2>应用'+b.dataset.layout+'</h2><p>范围：'+$('layout-scope').value+'。必要时拆分片段，仅修改选区；维护已知引用，冲突则整次取消。</p><p>双行参数：5%／60% 左侧中心；95%／80% 右侧中心。</p><div class="row"><button data-action="dismiss">取消</button><button data-action="layout-confirm">应用布局</button></div>');}switch(b.dataset.action){case 'dismiss':closeDialog();break;case 'advanced':advanced=!advanced;render();break;case 'apply':applied={...libraryPreset};render();feedback('固定预设快照应用到所选对象；一个可撤销事务');break;case 'remove':applied=null;render();feedback('恢复继承，上级效果继续生效');break;case 'update':if(applied){applied={...libraryPreset};render();feedback('已明确更新应用快照');}break;case 'edit-copy':navigate('factory');dirty=true;feedback('从工程固定快照创建工坊草稿');break;case 'template-new':dirty=true;feedback('新预设草稿，明确保存后才能应用');break;case 'script':window.open(location.pathname+'?script=1','mako-script-config','width=1000,height=760');break;case 'adopt':dirty=true;feedback('显式采用配置快照，尚未保存预设');break;case 'template-restart':templateTime=0;templatePlaying=true;break;case 'layout-confirm':closeDialog();feedback('仅选区布局改变；一次事务可撤销');break;default:if(b.dataset.action)feedback('演示入口：'+b.textContent);}});
document.addEventListener('input',e=>{if(e.target.dataset.line!==undefined)lines[+e.target.dataset.line].text=e.target.value;if(e.target.dataset.start!==undefined)lines[+e.target.dataset.start].start=+e.target.value;if(e.target.dataset.end!==undefined)lines[+e.target.dataset.end].end=+e.target.value;if(task==='factory'){if(e.target.id==='preset-name')draftName=e.target.value;dirty=true;$('save-status').textContent='预设草稿';}updateTime();});
$('new').onclick=startProject;$('recent').onclick=startProject;$('home-factory').onclick=()=>enter('factory');$('theme').onclick=()=>document.body.classList.toggle('dark');$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放';};$('seek').oninput=e=>{time=+e.target.value;updateTime();};$('loop').onclick=e=>e.target.classList.toggle('active');$('panel-button').onclick=()=>{$('library').classList.remove('open');$('panel').classList.toggle('open');};$('library-button').onclick=()=>{$('panel').classList.remove('open');$('library').classList.toggle('open');};$('save').onclick=()=>task==='factory'?saveTemplate():feedback('工程保存固定快照和完整资源闭包');$('export').onclick=()=>dialog('<h2>导出完整成片</h2><p>完整预设执行，与正式预览同帧。普通／透明输出及取消保护保持。</p><button data-action="dismiss">关闭</button>');$('back').onclick=()=>{if(dirty){dialog('<h2>处理模板草稿</h2><p>保存、放弃或取消；取消保留所有状态。</p><div class="row"><button data-action="dismiss">取消</button><button id="draft-save">保存预设</button><button id="draft-discard">放弃</button></div>');$('draft-save').onclick=()=>{saveTemplate();closeDialog();};$('draft-discard').onclick=()=>{dirty=false;draftName=null;closeDialog();goHome();};}else goHome();};
function goHome(){playing=false;templatePlaying=false;$('shell').classList.add('hidden');$('home').classList.remove('hidden');}
if(new URLSearchParams(location.search).has('script')){$('home').classList.add('hidden');$('shell').classList.remove('hidden');document.querySelector('nav').classList.add('hidden');$('project-player').classList.add('hidden');$('project-label').textContent='脚本配置库';$('export').classList.add('hidden');$('save').textContent='保存配置';$('save').onclick=()=>feedback('配置及固定源码修订已保存；工坊须明确采用');$('central').innerHTML='<h2>脚本配置库</h2><div class="row"><button>材质</button><button>效果</button><button data-action="transfer">导入／分享 .mkfx</button></div><textarea class="scriptcode" aria-label="源码草稿">public void Evaluate(FrameContext frame) { }</textarea><div class="row"><button data-action="compile">编译包</button><button data-action="validate">运行验证</button></div><p>保存失败源码、编译、运行验证分别执行；不读取具体歌曲。</p>';$('panel').innerHTML='<h3>配置参数</h3><div class="form"><span>放大比例</span><input value="1.15"><span>读取范围</span><select><option>绑定来源</option><option>工程</option><option>关联分支</option></select></div><small>全局属于应用范围，配置不包含歌曲对象 ID。</small>';}
let previous=performance.now();function tick(now){let dt=Math.min(.1,(now-previous)/1000);previous=now;if(playing){time=(time+dt)%12;updateTime();}if(templatePlaying&&task==='factory'){templateTime=(templateTime+dt)%4;if($('template-time'))$('template-time').textContent='工坊试样：'+templateTime.toFixed(2)+' 秒';}requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script>
</body>
</html>
