name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install native test dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            pkg-config \
            libsystemd-dev \
            ffmpeg \
            fonts-noto-cjk \
            fonts-noto-color-emoji \
            libfontconfig1 \
            libfreetype6

      - name: Install native test dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress
          }

      - name: Restore
        working-directory: backend
        run: dotnet restore MakoKaraGenerator.slnx

      # Ubuntu 24.04 apt ships FFmpeg 6 (libavformat60), whereas native/media-presentation
      # requires FFmpeg 9 (libavformat>=63); disabling it lets MediaPresentation tests self-skip cleanly.
      - name: Build (Linux)
        if: runner.os == 'Linux'
        working-directory: backend
        run: dotnet build MakoKaraGenerator.slnx --configuration Release --no-restore -p:MakoMediaPresentationEnabled=false

      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: backend
        run: dotnet build MakoKaraGenerator.slnx --configuration Release --no-restore

      # Exclude Category=PublishedServer (RubyTimelineTransportTests requires pre-published self-contained artifacts).
      - name: Test
        working-directory: backend
        run: dotnet test MakoKaraGenerator.slnx --configuration Release --no-build --no-restore --filter "Category!=PublishedServer"

  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir frontend run typecheck

      # Runs fast standalone unit tests; full `pnpm --dir frontend test` also runs
      # test:integration which requires a prior root `pnpm build` (published backend).
      - name: Unit tests
        run: pnpm --dir frontend run test:unit

  root-and-tools:
    name: Root JS & Host Tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run root Node tests
        run: pnpm run test:root

      - name: Run backend-web-host Python tests (Linux)
        if: runner.os == 'Linux'
        run: python3 -m unittest backend/tools/backend-web-host/test_host.py

      - name: Run backend-web-host Python tests (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest backend/tools/backend-web-host/test_host.py
