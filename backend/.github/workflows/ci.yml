name: Linux build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ffmpeg \
            fonts-noto-cjk \
            fonts-noto-color-emoji \
            libfontconfig1 \
            libfreetype6

      - name: Restore
        run: dotnet restore MakoKaraGenerator.slnx

      - name: Build
        run: dotnet build MakoKaraGenerator.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MakoKaraGenerator.slnx --configuration Release --no-build --no-restore
