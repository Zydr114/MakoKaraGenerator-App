<div id="mk-redesign" aria-label="MakoKara 新版交互设计稿">
  <style>
    #mk-redesign{--mk-bg:light-dark(#f2f4f8,#171b23);--mk-panel:light-dark(#ffffff,#202631);--mk-soft:light-dark(#e9eef5,#282f3c);--mk-text:light-dark(#18243a,#e7edf7);--mk-muted:light-dark(#526077,#a8b6ca);--mk-line:light-dark(#ced7e4,#3a4557);--mk-blue:light-dark(#285fc3,#83adff);--mk-accent:light-dark(#e3ecff,#2a3d60);--mk-good:light-dark(#206447,#95d8b4);--mk-warn:light-dark(#835608,#f0c777);--mk-warn-bg:light-dark(#fff3d9,#3d3321);--mk-red:light-dark(#a33140,#ffadba);color:var(--mk-text);font:14px/1.5 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;width:100%;color-scheme:light dark}

    #mk-redesign button:disabled{opacity:.5;cursor:not-allowed}
    #mk-redesign button:focus-visible,#mk-redesign input:focus-visible,#mk-redesign select:focus-visible,#mk-redesign textarea:focus-visible{outline:2px solid var(--mk-blue);outline-offset:3px}
    #mk-redesign .primary{background:light-dark(#285fc3,#487bd0);border-color:transparent;color:#fff}
    #mk-redesign .primary:hover{background:light-dark(#204ea6,#3869b8)}
    #mk-redesign .quiet{background:transparent;border-color:transparent}
    #mk-redesign .active,#mk-redesign button[aria-pressed=true]{color:var(--mk-blue);background:var(--mk-accent);border-color:var(--mk-blue)}
    #mk-redesign input,#mk-redesign select,#mk-redesign textarea{border:1px solid var(--mk-line);border-radius:6px;background:var(--mk-bg);padding:7px 9px;width:100%;max-width:100%}
    #mk-redesign input[type=checkbox]{width:17px;height:17px;accent-color:var(--mk-blue)}

    #mk-redesign .nav{padding:9px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--mk-line);background:var(--mk-panel)}
    #mk-redesign .nav button{border-color:transparent;background:transparent;padding:8px 13px}
    #mk-redesign .nav button[aria-current=page]{background:var(--mk-accent);color:var(--mk-blue)}

    #mk-redesign .tag.warn{color:var(--mk-warn);background:var(--mk-warn-bg)}

    #mk-redesign .warning{background:var(--mk-warn-bg);border-color:var(--mk-warn);color:var(--mk-warn)}
    #mk-redesign .field{display:flex;flex-direction:column;gap:5px}

    #mk-redesign .check{display:flex;gap:8px;align-items:center}
    #mk-redesign .target{font-weight:600;font-size:15px;line-height:1.65}
    #mk-redesign .tabs{display:flex;border-bottom:1px solid var(--mk-line);gap:3px;flex-wrap:wrap}

    #mk-redesign .screen .lyric{font-size:clamp(18px,2.7vw,35px);font-weight:700;letter-spacing:-.02em;color:#f8fafc;text-align:center;-webkit-text-stroke:.4px #fff;text-shadow:0 2px 0 #283950;margin-top:36px;overflow-wrap:anywhere;line-height:1.7}
    #mk-redesign .screen .sung{color:var(--demo-fill,#79b5ff)}
    #mk-redesign .screen .nextline{font-size:clamp(16px,2.2vw,28px);color:#e2e9f2;margin-top:8px;text-align:center}
    #mk-redesign .screen .screen-label{position:absolute;left:10px;top:9px;color:#ccd7ea;font-size:11px;background:#182437;padding:3px 6px;border-radius:3px}
    #mk-redesign .screen .safe{position:absolute;inset:13%;border:1px dashed #8090a960;pointer-events:none}
    #mk-redesign .screen .target-box{position:absolute;inset:41% 8% 18%;border:1px solid #86b4ff;pointer-events:none}
    #mk-redesign .previewbar{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mk-muted)}
    #mk-redesign .previewbar select{width:auto;padding:4px 7px;font-size:12px}
    #mk-redesign .callto{margin-top:auto;display:flex;flex-direction:column;gap:9px;padding-top:12px;border-top:1px solid var(--mk-line)}
    #mk-redesign .preset-card{padding:9px;text-align:left;width:100%;display:flex;gap:10px;align-items:center}
    #mk-redesign .thumb{display:flex;align-items:center;justify-content:center;min-height:52px;min-width:64px;border-radius:5px;background:linear-gradient(130deg,#1e2b43,#172133);color:#dce7f8;font-size:19px;font-weight:600}
    #mk-redesign .preset-card.chosen{border-color:var(--mk-blue);background:var(--mk-accent)}
    #mk-redesign .preset-card .meta{display:flex;flex-direction:column;gap:3px}
    #mk-redesign .layout-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    #mk-redesign .layout-option{display:flex;flex-direction:column;gap:8px;align-items:center;padding:10px 6px}
    #mk-redesign .layout-lines{height:42px;width:78px;display:flex;flex-direction:column;justify-content:center;gap:5px;background:var(--mk-bg);padding:8px;border-radius:3px}
    #mk-redesign .layout-lines i{display:block;height:3px;background:var(--mk-blue);width:75%;align-self:center}
    #mk-redesign .layout-lines.offset i:first-child{align-self:flex-start}#mk-redesign .layout-lines.offset i:last-child{align-self:flex-end}
    #mk-redesign .lyric-input{font-size:22px;padding:13px}
    #mk-redesign .tokens{display:flex;gap:7px;flex-wrap:wrap}
    #mk-redesign .tokens button{min-width:41px;min-height:41px;font-size:18px}
    #mk-redesign .neutral{padding:16px;text-align:center;background:var(--mk-soft);border-radius:6px;margin-top:auto}
    #mk-redesign .timing{border-top:1px solid var(--mk-line);padding:12px 16px;background:var(--mk-panel);display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
    #mk-redesign .timing .field{max-width:160px}
    #mk-redesign .transport{display:flex;gap:11px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--mk-panel);border-top:1px solid var(--mk-line)}
    #mk-redesign .transport select{width:83px;padding:5px;font-size:12px}
    #mk-redesign .timeline{padding:9px 16px 14px;background:light-dark(#e9eef6,#141c28)}
    #mk-redesign .ruler{display:flex;justify-content:space-between;font-size:11px;color:var(--mk-muted);padding-bottom:6px}
    #mk-redesign .wave{display:flex;align-items:center;height:35px;gap:1px;border-bottom:1px solid var(--mk-line);position:relative}
    #mk-redesign .wave i{display:block;flex:1;min-width:1px;background:light-dark(#6590cb,#8eaddc);border-radius:1px}
    #mk-redesign .tracks{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:7px}
    #mk-redesign .tracks span{border-radius:2px;background:var(--mk-accent);padding:4px 8px;font-size:12px;overflow-wrap:anywhere}
    #mk-redesign .tracks span:first-child{border-left:3px solid var(--mk-blue)}
    #mk-redesign .status{padding:8px 16px;border-top:1px solid var(--mk-line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mk-muted);background:var(--mk-panel);min-height:38px}
    #mk-redesign .table{border-collapse:collapse;width:100%;font-size:13px}
    #mk-redesign .table th,#mk-redesign .table td{border-bottom:1px solid var(--mk-line);text-align:left;padding:10px 7px;overflow-wrap:anywhere}
    #mk-redesign .tree{display:flex;flex-direction:column;gap:4px}
    #mk-redesign .tree .indent{padding-left:25px}
    #mk-redesign details{border-top:1px solid var(--mk-line);padding-top:10px}
    #mk-redesign summary{color:var(--mk-muted);font-size:12px;margin-bottom:9px}
    #mk-redesign .settings{padding:22px;max-width:850px;width:100%;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:25px}
    #mk-redesign .wide{grid-column:1/-1}
    #mk-redesign .empty{padding:35px 20px;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
    #mk-redesign .code{font:12px/1.8 monospace;min-height:240px;white-space:pre-wrap}
    #mk-redesign .dot{width:7px;height:7px;border-radius:50%;background:var(--mk-good);display:inline-block}
    #mk-redesign .error{color:var(--mk-red);font-size:12px}
    #mk-redesign .review-caption{margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--mk-muted);font-size:12px}
    #mk-redesign .progress{height:6px;background:var(--mk-soft);border-radius:4px;overflow:hidden}
    #mk-redesign .progress b{display:block;height:100%;width:100%;background:var(--mk-good)}
    @media(max-width:1000px){#mk-redesign .columns{grid-template-columns:200px minmax(0,1fr) 252px}#mk-redesign .two{grid-template-columns:190px minmax(0,1fr)}#mk-redesign .top{gap:10px}#mk-redesign .stage{min-height:285px;padding:12px}#mk-redesign .screen .lyric{font-size:23px}#mk-redesign .screen .nextline{font-size:19px}}
    @media(max-width:780px){#mk-redesign .columns,#mk-redesign .two{grid-template-columns:1fr}#mk-redesign .side{border-right:0;border-bottom:1px solid var(--mk-line)}#mk-redesign .side .list{display:grid;grid-template-columns:1fr 1fr;gap:4px}#mk-redesign .inspector{border-left:0;border-top:1px solid var(--mk-line)}#mk-redesign .stage{min-height:270px}#mk-redesign .screen{max-width:490px}#mk-redesign .screen .lyric{font-size:28px}#mk-redesign .screen .nextline{font-size:23px}#mk-redesign .callto{margin-top:3px}#mk-redesign .settings{padding:16px}#mk-redesign .top .grow{display:none}#mk-redesign .top .row{margin-left:auto}#mk-redesign .nav .resource{margin-left:0}#mk-redesign .nav{gap:4px}#mk-redesign .pagebar h2{font-size:16px}}
    @media(max-width:440px){#mk-redesign .project{padding-left:9px;font-size:12px}#mk-redesign .top{padding:11px}#mk-redesign .top .row{margin-left:0;width:100%}#mk-redesign .top .row button{flex:1;padding:7px}#mk-redesign .nav{padding:8px}#mk-redesign .nav button{padding:8px;font-size:13px}#mk-redesign .nav .resource{padding-left:5px}#mk-redesign .center,#mk-redesign .inspector{padding:12px}#mk-redesign .settings{grid-template-columns:1fr;gap:18px}#mk-redesign .timing .field{max-width:calc(50% - 8px)}#mk-redesign .screen .lyric{font-size:22px}#mk-redesign .screen .nextline{font-size:19px}#mk-redesign .tracks{grid-template-columns:repeat(3,1fr)}#mk-redesign .fields{gap:8px}#mk-redesign .lyric-input{font-size:19px}#mk-redesign .row{gap:6px}#mk-redesign .table{font-size:12px}}
    #mk-redesign .screen .lyric{font-size:clamp(23px,7.5cqw,46px)}
    #mk-redesign .screen .nextline{font-size:clamp(19px,6cqw,36px)}
    @media(pointer:coarse){#mk-redesign button,#mk-redesign select,#mk-redesign input{min-height:44px}#mk-redesign input{font-size:16px}}
  </style>
  <div class="review-caption"><span>MakoKara · 新版交互稿</span><span class="grow"></span><span>交互预览 · 不执行播放、编译或导出</span></div>
  <div class="shell">
    <header class="top">
      <span class="brand">MakoKara</span><div class="project"><strong>Test</strong><span id="mk-project-state" class="caption">工程已保存</span></div><span class="grow"></span>
      <div class="row"><button data-route="settings" class="quiet">工程设置</button><button data-action="save-project">保存工程</button><button data-route="export" class="primary">导出视频</button></div>
    </header>
    <nav class="nav" aria-label="主要工作区"><button data-route="lyrics">歌词与打轴</button><button data-route="appearance">画面与编排</button><div class="resource"><button data-route="workshop">预设工坊</button></div></nav>
    <main id="mk-content"></main>
    <footer class="status"><span class="dot"></span><span id="mk-feedback" role="status" aria-live="polite">就绪</span><span class="grow"></span><button class="quiet" data-action="undo" id="mk-undo" disabled>撤销</button></footer>
  </div>
  <script>
  (()=>{
    const root=document.getElementById('mk-redesign');
    const content=root.querySelector('#mk-content');
    const lines=['朝の光浴びて','青い空見上げ','風の声を聞く','君と歩く道に','夢の花が咲く','明日へ続いて'];
    const presets=[{name:'清晰描边',desc:'整行 · 蓝白双色',color:'#79b5ff'},{name:'暖色强调',desc:'整行 · 暖色高亮',color:'#efb56d'},{name:'玻璃光泽',desc:'组合 · 需要歌词来源',color:'#b5a1ed'}];
    const defaults={route:'appearance',line:0,token:0,selected:[0],multiSelect:false,effectWasValidated:false,scope:'lines',candidate:0,choosing:false,mapped:false,playing:false,applied:{},disabled:{},layout:1,layoutCandidate:1,range:'all',rangeStart:1,rangeEnd:3,authorTab:'basic',authorName:'清晰描边 · 副本',authorDirty:false,authorReadOnly:true,authorFill:'#79b5ff',authorRevision:0,hasSavedPreset:false,returnTarget:null,effectTab:'config',effectImported:false,effectAmount:'0.7',effectDirty:false,effectValid:false,componentSaved:false,sceneTab:'structure',sceneDirty:false,sceneX:'50',sceneY:'68',settingDuration:'00:20.000',background:'夜空背景.png',settingWidth:'640',settingHeight:'480',settingFps:'24',projectDirty:false,previewMode:'time',zoom:'fit',lyricStart:'00:02.000',lyricEnd:'00:02.500',tokenError:'',sourceCode:'public void Render(Frame frame)\n{\n    // 在这里编写效果。\n    var amount = frame.Parameters.Amount;\n}',sourceDirty:false,sourceSaved:false,sourceCompiled:false,sourceAdopted:false};
    let state={...defaults};let history=[];
    const saved=window.openai?.widgetState?.privateContent;
    if(saved&&Array.isArray(saved.selected)&&typeof saved.route==='string')state={...defaults,...saved};
    const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const btn=(text,attrs='',kind='')=>`<button type="button" class="${kind}" ${attrs}>${text}</button>`;
    const field=(label,value,key,type='text')=>`<label class="field"><span>${label}</span><input type="${type}" data-field="${key}" value="${esc(value)}"></label>`;
    let feedbackTimer;
    const message=text=>{clearTimeout(feedbackTimer);root.querySelector('#mk-feedback').textContent=text;feedbackTimer=setTimeout(()=>{root.querySelector('#mk-feedback').textContent='就绪';},4500);};
    function remember(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{page:state.route,selectedLines:state.selected.map(i=>i+1),presetWorkflow:'先制作预设，再应用'},privateContent:state}).catch(()=>{});}
    function target(){if(state.scope==='project')return '工程默认';if(!state.selected.length)return '未选择对象';return state.selected.length===1?`主歌词 / 第 ${state.selected[0]+1} 行`:`主歌词 / 第 ${state.selected.map(i=>i+1).join('、')} 行 · ${state.selected.length} 行`;}
    function currentPreset(){if(state.scope==='project')return state.applied.project||'Test';if(!state.selected.length)return '未选择';const names=state.selected.map(i=>state.applied[i]||state.applied.project||'Test');return new Set(names).size>1?'混合预设':names[0];}
    function checkpoint(){history.push(JSON.parse(JSON.stringify({applied:state.applied,disabled:state.disabled,layout:state.layout,projectDirty:state.projectDirty,lyricStart:state.lyricStart,lyricEnd:state.lyricEnd,settingDuration:state.settingDuration,background:state.background,settingWidth:state.settingWidth,settingHeight:state.settingHeight,settingFps:state.settingFps})));if(history.length>12)history.shift();state.projectDirty=true;}
    const caption=t=>`<span class="caption">${t}</span>`;
    function bar(title,sub,actions=''){return `<div class="pagebar"><div><h2>${title}</h2>${sub?caption(sub):''}</div><span class="grow"></span><div class="row">${actions}</div></div>`;}
    function lineList(appearance=false){
      const multi=appearance&&state.multiSelect;
      return `<aside class="side"><div class="row"><strong>主歌词</strong><span class="tag">6 行</span><span class="grow"></span>${appearance?btn(multi?'完成':'多选',`data-action="multi-select" aria-pressed="${multi}"`,'quiet'):''}</div>${appearance?btn('工程默认',`data-action="scope-project" aria-pressed="${state.scope==='project'}"`):btn('添加歌词…','data-action="add-lyrics"')}<div class="list">${lines.map((l,i)=>{
        const selected=appearance?state.scope==='lines'&&state.selected.includes(i):state.line===i;
        const info=appearance?(state.applied[i]?'本地 · '+esc(state.applied[i]):''):`00:${String(2+i*3).padStart(2,'0')}.000 — 00:${String(5+i*3).padStart(2,'0')}.000`;
        const text=`<span>${String(i+1).padStart(2,'0')}　${l}${info?`<small>${info}</small>`:''}</span>`;

    function scene(){return bar('自定义布局',`主歌词 · ${state.sceneDirty?'未应用':'已应用'}`,btn('放弃并返回','data-action="discard-scene"')+btn('应用并返回',`data-action="apply-scene" ${!state.sceneDirty?'disabled':''}`,'primary'))+`<div class="pagebar"><div class="tabs">${['structure','assign','time'].map((k,i)=>btn(['布局结构','歌词分配','时间检查'][i],`data-scene-tab="${k}"`,state.sceneTab===k?'selected':'')).join('')}</div></div><div class="columns"><aside class="side"><h3>布局结构</h3><div class="tree"><button class="item" data-action="scene-root">主歌词<small>布局组 · 6 行</small></button><button class="item selected indent" data-action="scene-container">卡拉 OK 双行<small>歌词容器 · 默认布局</small></button><button class="item indent" data-action="scene-top">上行位置<small>显示位置 1</small></button><button class="item indent" data-action="scene-bottom">下行位置<small>显示位置 2</small></button></div>${btn('添加容器…','data-action="scene-add"','quiet')}</aside><section class="center">${state.sceneTab==='assign'?`<h3>歌词分配</h3><table class="table"><thead><tr><th>歌词段</th><th>布局</th><th>分配</th></tr></thead><tbody><tr><td>第 1–6 行</td><td>卡拉 OK 双行</td><td>默认</td></tr></tbody></table><span class="caption">6 / 6 行已分配</span>${btn('添加例外歌词段…','data-action="scene-segment"')}<details><summary>前奏与准备提示</summary>${btn('添加前奏…','data-action="scene-leadin"','quiet')}</details>`:canvas(state.sceneTab==='time'?'时间检查 · 脚本关闭':'布局预览 · 脚本关闭',true,false,true)}</section><aside class="inspector"><div><span class="caption">所选布局对象</span><div class="target">卡拉 OK 双行</div><small>2 个显示位置</small></div><section class="section"><h3>位置</h3><div class="fields">${field('X（%）',state.sceneX,'sceneX','number')}${field('Y（%）',state.sceneY,'sceneY','number')}</div><label class="field"><span>锚点</span><select><option>中心</option><option>左下</option><option>右下</option></select></label><div class="fields">${field('旋转（°）','0','rotation','number')}${field('缩放','1','scale','number')}</div></section><details><summary>父级与高级属性</summary><p class="caption">父级：主歌词布局组</p></details>${btn('向上移动 5%','data-action="scene-nudge"')}</aside></div>`+timeline();}
    function settings(){return bar('工程设置','Test',btn('返回画面','data-route="appearance"'))+`<div class="settings"><section class="section"><h3>画布</h3><div class="fields">${field('宽度（px）',state.settingWidth,'settingWidth','number')}${field('高度（px）',state.settingHeight,'settingHeight','number')}</div><label class="field"><span>帧率</span><select data-field="settingFps">${['24','30','60'].map(v=>`<option ${state.settingFps===v?'selected':''}>${v}</option>`).join('')}</select></label></section><section class="section"><h3>背景</h3><div class="thumb" style="height:90px">${state.background?'夜空':'无背景媒体'}</div><span class="caption">${esc(state.background||'使用纯色底色')}</span><div class="row">${btn(state.background?'替换背景…':'选择背景…','data-action="background"')}${btn('移除',`data-action="remove-background" ${!state.background?'disabled':''}`,'quiet')}</div><label class="field"><span>适配方式</span><select><option>完整显示</option><option>填满画布</option></select></label></section><section class="section"><h3>音频</h3><strong>sample.wav</strong><span class="caption">00:20.000 · 已就绪</span>${btn('替换音频…','data-action="audio"')}</section><section class="section"><h3>输出范围</h3>${field('结束时刻',state.settingDuration,'settingDuration')}<div class="row">${btn('按当前音频计算','data-action="duration-audio"')}${btn('按歌词末尾计算','data-action="duration-lyrics"')}</div></section><div class="wide row"><span class="grow"></span>${btn('查看导出摘要','data-route="export"','primary')}</div></div>`;}
    function exportPage(){return bar('导出视频','Test · 工程输出',btn('返回画面','data-route="appearance"'))+`<div class="settings"><section class="section"><h3>输出文件</h3>${field('文件路径','Test.mp4','outputPath')}<label class="field"><span>输出类型</span><select><option>普通视频</option><option>透明视频</option></select></label><label class="field"><span>质量</span><select><option>高质量</option><option>标准</option></select></label></section><section class="section"><h3>工程摘要</h3><strong>${esc(state.settingWidth)} × ${esc(state.settingHeight)} · ${esc(state.settingFps)} fps</strong><span>结束时刻 ${esc(state.settingDuration)}</span><span class="caption">音频：sample.wav</span>${btn('修改工程设置','data-route="settings"')}</section><div class="wide row end">${btn('开始导出','data-action="export-demo"','primary')}</div></div>`;}
    function render(){const active=document.activeElement;const focusKey=['data-select-line','data-line','data-token','data-field','data-preset','data-layout','data-action'].find(k=>active?.hasAttribute(k));const focusValue=focusKey?active.getAttribute(focusKey):null;content.innerHTML=({lyrics,appearance,choose,layout,workshop,effects,scene,settings,export:exportPage}[state.route]||appearance)();root.querySelector('#mk-project-state').textContent=state.projectDirty?'工程未保存':'工程已保存';root.querySelector('#mk-undo').disabled=history.length===0;root.querySelectorAll('.nav button[data-route]').forEach(b=>{const group=['workshop','effects'].includes(state.route)?'workshop':state.route==='lyrics'?'lyrics':'appearance';b.setAttribute('aria-current',b.dataset.route===group?'page':'false');});if(focusKey&&!active.isConnected){const next=root.querySelector('['+focusKey+'="'+CSS.escape(focusValue)+'"]');if(next&&!next.disabled)next.focus({preventScroll:true});}}
    function route(next){message('就绪');if(state.route==='choose'&&next!=='choose'){state.choosing=false;state.useSaved=false;}state.route=next;if(next==='choose'){state.choosing=true;state.useSaved=false;}if(next==='layout')state.layoutCandidate=state.layout;render();remember();}
    function applyPreset(){checkpoint();const name=state.useSaved?state.authorName:presets[state.candidate].name;if(state.scope==='project')state.applied.project=name;else state.selected.forEach(i=>state.applied[i]=name);state.choosing=false;route('appearance');message(`已应用「${name}」`);}
    root.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b||b.disabled)return;
      if(b.dataset.route){route(b.dataset.route);return;}
      if(b.dataset.line!==undefined){const i=+b.dataset.line;state.line=i;state.token=0;if(state.route!=='lyrics'){state.scope='lines';state.selected=e.ctrlKey||e.metaKey?(state.selected.includes(i)?state.selected.filter(n=>n!==i):[...state.selected,i].sort((a,b)=>a-b)):[i];}render();remember();return;}
      if(b.dataset.token!==undefined){state.token=+b.dataset.token;render();return;}
      if(b.dataset.preset!==undefined){state.candidate=+b.dataset.preset;state.useSaved=false;render();remember();return;}
      if(b.dataset.layout!==undefined){state.layoutCandidate=+b.dataset.layout;render();return;}
      if(b.dataset.authorTab){state.authorTab=b.dataset.authorTab;render();return;}
      if(b.dataset.effectTab){state.effectTab=b.dataset.effectTab;render();return;}
      if(b.dataset.sceneTab){state.sceneTab=b.dataset.sceneTab;render();return;}
      const a=b.dataset.action;
      switch(a){
        case 'save-project':state.projectDirty=false;render();message('工程已保存');break;
        case 'undo':if(history.length){Object.assign(state,history.pop());render();message('已撤销');}break;
        case 'scope-project':state.scope='project';state.selected=[];render();break;
        case 'multi-select':state.multiSelect=!state.multiSelect;render();break;
        case 'select-all':state.scope='lines';state.selected=lines.map((_,i)=>i);render();break;
        case 'clear-selection':state.selected=[];state.scope='lines';render();break;
        case 'preview-selected':state.previewMode='selected';render();message('所选行试看');break;
        case 'preview-time':state.previewMode='time';render();break;
        case 'copy-workshop':state.returnTarget={label:target(),selected:[...state.selected],scope:state.scope};state.authorReadOnly=false;state.authorName=(state.route==='choose'?(state.useSaved?state.authorName:presets[state.candidate].name):currentPreset())+' · 副本';state.authorFill=state.route==='choose'&&!state.useSaved?presets[state.candidate].color:state.authorFill;state.authorDirty=true;route('workshop');message('已创建预设副本');break;
        case 'new-author':state.authorName='未命名预设';state.authorReadOnly=false;state.authorDirty=true;render();break;
        case 'copy-builtin':state.authorName='经典整行 · 副本';state.authorReadOnly=false;state.authorDirty=true;render();break;
        case 'personal':state.authorReadOnly=false;render();break;
        case 'builtin':state.authorReadOnly=true;render();break;
        case 'save-author':state.authorDirty=false;state.hasSavedPreset=true;render();message('已保存预设');break;
        case 'save-return':state.authorDirty=false;state.hasSavedPreset=true;state.scope=state.returnTarget?.scope||'lines';state.selected=state.returnTarget?.selected||[0];state.route='choose';state.choosing=true;state.useSaved=true;state.candidate=0;render();message('预设已保存');break;
        case 'return-author':route('appearance');message(state.authorDirty?'草稿已保留':'就绪');break;
        case 'choose-saved':state.useSaved=true;state.candidate=0;render();break;
        case 'apply-preset':applyPreset();break;
        case 'cancel-preset':route('appearance');message('已取消试看');break;
        case 'toggle-preset':checkpoint();{let key=state.scope==='project'?'project':state.selected[0];state.disabled[key]=!state.disabled[key];}render();message('已更改启用状态');break;
        case 'remove-preset':checkpoint();if(state.scope==='project')delete state.applied.project;else state.selected.forEach(i=>delete state.applied[i]);render();message('已移除本地预设');break;
        case 'apply-layout':checkpoint();state.layout=state.layoutCandidate;render();message('布局已应用');break;
        case 'play':state.playing=!state.playing;render();message(state.playing?'播放预览':'已暂停');break;
        case 'new-component':state.effectImported=false;state.effectValid=false;state.effectTab='config';render();break;
        case 'import-effect':state.effectImported=true;state.effectDirty=true;render();message('已导入效果包');break;
        case 'save-component':state.effectDirty=false;render();message('组件已保存');break;
        case 'copy-parent-add':state.authorReadOnly=false;state.authorName='经典整行 · 副本';
        case 'add-component':state.effectDirty=false;state.componentSaved=true;state.authorDirty=true;state.authorTab='effects';route('workshop');message('已加入预设');break;
        case 'validate-effect':state.effectValid=true;state.effectWasValidated=true;render();message('验证预览已完成');break;
        case 'save-source':state.sourceDirty=false;state.sourceSaved=true;state.sourceCompiled=false;render();message('修订已保存');break;
        case 'compile-source':state.sourceCompiled=true;render();message('编译预览已完成');break;
        case 'adopt-source':state.sourceAdopted=true;state.effectValid=false;state.effectDirty=true;render();break;
        case 'scene-nudge':state.sceneY=String(Number(state.sceneY)-5);state.sceneDirty=true;render();break;
        case 'discard-scene':state.sceneDirty=false;state.sceneY='68';route('appearance');message('已放弃改动');break;
        case 'apply-scene':checkpoint();state.sceneDirty=false;route('appearance');message('布局已应用');break;
        case 'duration-audio':checkpoint();state.settingDuration='00:20.000';render();message('结束时刻已更新');break;
        case 'duration-lyrics':checkpoint();state.settingDuration='00:20.000';render();message('结束时刻已更新');break;
        case 'background':checkpoint();state.background='夕空背景.png';render();message('背景已替换');break;
        case 'remove-background':checkpoint();state.background='';render();message('背景已移除');break;
        case 'updates':message('当前副本已是最新');break;
        case 'locate':message(`定位示例：第 ${state.line+1} 行起点；实际工程中会移动播放头。`);break;
        case 'audition':case 'loop':message('试听与循环操作示例：当前行区间 00:02.000–00:05.000。');break;
        case 'export-demo':message('导出未执行：当前为交互预览');break;
        default:message('此操作未包含在交互预览中');
      }remember();
    });
    function change(el){if(el.dataset.selectLine!==undefined){const i=+el.dataset.selectLine;state.scope='lines';state.selected=el.checked?[...new Set([...state.selected,i])].sort((a,b)=>a-b):state.selected.filter(n=>n!==i);render();remember();return;}const key=el.dataset.field;if(!key)return;let value=el.value;
      if(key==='mapped'){state.mapped=value==='main';render();remember();return;}
      if(['rangeStart','rangeEnd'].includes(key)){state[key]=+value;render();remember();return;}
      if(['zoom','range','sample'].includes(key)){state[key]=value;render();remember();return;}
      if(['lyricStart','lyricEnd'].includes(key)&&state[key]===value&&!state.tokenError)return;
      if(['lyricStart','lyricEnd'].includes(key)){const start=key==='lyricStart'?value:state.lyricStart,end=key==='lyricEnd'?value:state.lyricEnd;const parse=v=>/^\d{2}:\d{2}\.\d{3}$/.test(v)?Number(v.slice(0,2))*60+Number(v.slice(3)):NaN;let s=parse(start),n=parse(end);if(!Number.isFinite(s)||!Number.isFinite(n)||n<=s){state.tokenError=(!Number.isFinite(s)||!Number.isFinite(n))?'请输入 mm:ss.mmm 格式的时间':'结束须晚于开始';el.setAttribute('aria-invalid','true');el.setAttribute('aria-describedby','mk-time-error');const error=root.querySelector('#mk-time-error');if(error)error.textContent=state.tokenError;return;}checkpoint();state[key]=value;state.tokenError='';el.removeAttribute('aria-invalid');el.removeAttribute('aria-describedby');root.querySelector('#mk-project-state').textContent='工程未保存';root.querySelector('#mk-undo').disabled=false;root.querySelector('#mk-time-error').textContent='';message('时间已更新');remember();return;}
      if(key==='sourceCode'){state.sourceCode=value;state.sourceDirty=true;state.sourceCompiled=false;state.sourceSaved=false;state.sourceAdopted=false;const status=root.querySelector('[data-source-status]');if(status)status.textContent='未保存';root.querySelectorAll('[data-action="save-source"],[data-action="compile-source"],[data-action="adopt-source"]').forEach(b=>{const save=b.dataset.action==='save-source';b.disabled=!save;b.classList.toggle('primary',save);});remember();return;}
      if(key.startsWith('scene')||['rotation','scale'].includes(key)){state[key]=value;state.sceneDirty=true;render();remember();return;}
      if(key.startsWith('setting')){checkpoint();state[key]=value;render();message('工程设置已更新');remember();return;}
      if(state.route==='workshop'){state[key]=value;state.authorDirty=true;if(key==='authorFill')root.style.setProperty('--demo-fill',value);render();remember();return;}
      if(state.route==='effects'){state[key]=value;state.effectDirty=true;state.effectValid=false;render();remember();return;}
      message('此字段的实际处理未包含在交互预览中');
    }
    root.addEventListener('change',e=>change(e.target));
    root.addEventListener('input',e=>{if(e.target.dataset.field==='sourceCode')change(e.target);});
    root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input[data-field]')){change(e.target);e.target.blur();}if(e.key==='Escape'&&['lyricStart','lyricEnd'].includes(e.target.dataset.field)){e.target.value=state[e.target.dataset.field];e.target.removeAttribute('aria-invalid');e.target.removeAttribute('aria-describedby');state.tokenError='';const err=root.querySelector('#mk-time-error');if(err)err.textContent='';}});
    window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s&&Array.isArray(s.selected)&&typeof s.route==='string'){state={...defaults,...s};render();}});
    render();
    if(globalThis.Tweak){const design={density:'标准',preview:'time'};const tweak=new Tweak({container:root,onChange:()=>{root.style.fontSize=design.density==='紧凑'?'13px':'14px';state.previewMode=design.preview;render();}});tweak.addSelect(design,'density',{label:'界面密度',options:['标准','紧凑']});tweak.addSelect(design,'preview',{label:'默认画面上下文',options:[{label:'当前播放时刻',value:'time'},{label:'所选行试看',value:'selected'}]});}
  })();
  </script>
</div>
