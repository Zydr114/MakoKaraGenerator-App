<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'self';"
    />
    <title>MakoKara Generator</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #0f172a;
        color: #f3f7ff;
        font-family: 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei UI', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }

      .splash {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        border: 1px solid rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }

      .splash-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        background:
          url('../assets/splash-bg.webp') center / cover no-repeat,
          linear-gradient(135deg, #0d1b36 0%, #131c3c 55%, #1e1640 100%);
      }

      .splash-scrim {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: linear-gradient(
          180deg,
          rgba(10, 20, 56, 0) 0%,
          rgba(10, 20, 56, 0.04) 68%,
          rgba(10, 18, 48, 0.32) 100%
        );
      }

      .splash-top {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 16px 20px 0;
      }

      .version-pill {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.03em;
        color: #ffffff;
        text-shadow: 0 1px 4px rgba(10, 20, 60, 0.4);
      }

      .splash-hero {
        position: relative;
        z-index: 2;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 24px 6px;
        text-align: center;
      }

      .logo-wide {
        width: 416px;
        max-width: 86%;
        height: auto;
        display: block;
        filter: drop-shadow(0 8px 22px rgba(8, 12, 28, 0.36));
      }

      .splash-footer {
        position: relative;
        z-index: 2;
        padding: 0 22px 18px;
      }

      .status-line {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex: none;
        background: #00e5ff;
        animation: pulse-dot 1.4s ease-in-out infinite;
      }

      .status-text {
        font-size: 12px;
        font-weight: 500;
        color: rgba(244, 248, 255, 0.94);
        text-shadow: 0 1px 4px rgba(6, 10, 22, 0.6);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      @keyframes pulse-dot {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.35;
          transform: scale(0.82);
        }
      }
    </style>
  </head>
  <body>
    <main class="splash" role="status" aria-live="polite">
      <div class="splash-bg" aria-hidden="true"></div>
      <div class="splash-scrim" aria-hidden="true"></div>

      <header class="splash-top">
        <span class="version-pill" id="splash-version"></span>
      </header>

      <section class="splash-hero">
        <img class="logo-wide" src="../assets/logo-wide.webp" alt="MakoKara Generator" />
      </section>

      <footer class="splash-footer">
        <div class="status-line">
          <span class="status-dot" aria-hidden="true"></span>
          <span class="status-text" id="splash-status">正在初始化运行环境…</span>
        </div>
      </footer>
    </main>
    <script src="./splash.js"></script>
  </body>
</html>
