name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform(s) to test'
        required: false
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
      run_integration:
        description: 'Also build matched backend and run frontend integration tests'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform == 'linux' && '["ubuntu-latest"]' || (github.event_name == 'workflow_dispatch' && inputs.platform == 'windows' && '["windows-latest"]' || '["ubuntu-latest", "windows-latest"]')) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: backend/Directory.Packages.props

      - name: Install native test dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            pkg-config \
            libsystemd-dev \
            ffmpeg \
            fonts-noto-cjk \
            fonts-noto-color-emoji \
            fonts-dejavu-core \
            libfontconfig1 \
            libfreetype6

      - name: Cache Noto Sans CJK SC font (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: .local/ci-fonts/NotoSansCJKsc-Regular.otf
          key: noto-sans-cjk-sc-2.004

      - name: Install native test dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }
          $fontDir = Join-Path $PWD '.local/ci-fonts'
          $fontCache = Join-Path $fontDir 'NotoSansCJKsc-Regular.otf'
          $expectedSha = '2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b'
          $null = New-Item -ItemType Directory -Path $fontDir -Force
          if (-not (Test-Path -LiteralPath $fontCache) -or (Get-FileHash -LiteralPath $fontCache -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedSha) {
            $tmp = "$fontCache.part"
            curl.exe --fail --location --retry 3 --connect-timeout 20 --max-time 120 `
              'https://raw.githubusercontent.com/notofonts/noto-cjk/Sans2.004/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf' `
              -o $tmp
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $actualSha = (Get-FileHash -LiteralPath $tmp -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualSha -ne $expectedSha) {
              throw "NotoSansCJKsc-Regular.otf SHA-256 mismatch: got $actualSha, expected $expectedSha"
            }
            Move-Item -LiteralPath $tmp -Destination $fontCache -Force
          }
          $winFont = Join-Path $env:WINDIR 'Fonts\NotoSansCJKsc-Regular.otf'
          Copy-Item -LiteralPath $fontCache -Destination $winFont -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts' `
            -Name 'Noto Sans CJK SC (OpenType)' -Value 'NotoSansCJKsc-Regular.otf'
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class CiFontNotify {
            [DllImport("gdi32.dll", CharSet = CharSet.Unicode)]
            public static extern int AddFontResourceW(string lpFileName);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)]
            public static extern IntPtr SendMessageTimeoutW(IntPtr hWnd, uint Msg, UIntPtr wParam, IntPtr lParam, uint fuFlags, uint uTimeout, out UIntPtr lpdwResult);
          }
          "@
          [void][CiFontNotify]::AddFontResourceW($winFont)
          [UIntPtr]$res = [UIntPtr]::Zero
          [void][CiFontNotify]::SendMessageTimeoutW([IntPtr]0xFFFF, 0x001D, [UIntPtr]::Zero, [IntPtr]::Zero, 2, 1000, [ref]$res)
          if (Get-Service -Name FontCache -ErrorAction SilentlyContinue) {
            Restart-Service -Name FontCache -Force -ErrorAction SilentlyContinue
          }

      - name: Restore
        working-directory: backend
        run: dotnet restore MakoKaraGenerator.slnx

      # Headless CI runners do not run a systemd --user session for the Linux media envelope,
      # so disable mkg-presentation here (native CTests and bundled LGPL FFmpeg 9.0.2 are verified in package.yml).
      - name: Build (Linux)
        if: runner.os == 'Linux'
        working-directory: backend
        run: dotnet build MakoKaraGenerator.slnx --configuration Release --no-restore -p:MakoMediaPresentationEnabled=false

      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: backend
        run: dotnet build MakoKaraGenerator.slnx --configuration Release --no-restore

      # Exclude PublishedServer (needs pre-published self-contained artifacts) and RequiresVulkan
      # (GitHub-hosted runners have no Vulkan GPU driver). Run test projects sequentially (-m:1)
      # to avoid oversubscribing 2-core runners with concurrent child process trees.
      - name: Test
        working-directory: backend
        run: >-
          dotnet test MakoKaraGenerator.slnx
          --configuration Release
          --no-build
          --no-restore
          -m:1
          --filter "Category!=PublishedServer&Category!=RequiresVulkan"
          --blame-hang-timeout 90s
          --blame-hang-dump-type none

  frontend:
    name: Frontend (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform == 'linux' && '["ubuntu-latest"]' || (github.event_name == 'workflow_dispatch' && inputs.platform == 'windows' && '["windows-latest"]' || '["ubuntu-latest", "windows-latest"]')) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir frontend run typecheck

      # Runs fast standalone unit tests; integration tests can be enabled via workflow_dispatch (run_integration=true).
      - name: Unit tests
        run: pnpm --dir frontend run test:unit

  root-and-tools:
    name: Root JS & Host Tools (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform == 'linux' && '["ubuntu-latest"]' || (github.event_name == 'workflow_dispatch' && inputs.platform == 'windows' && '["windows-latest"]' || '["ubuntu-latest", "windows-latest"]')) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run root Node tests
        run: pnpm run test:root

      - name: Run backend-web-host Python tests (Linux)
        if: runner.os == 'Linux'
        run: python3 -m unittest backend/tools/backend-web-host/test_host.py

      - name: Run backend-web-host Python tests (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest backend/tools/backend-web-host/test_host.py

  contract:
    name: API Contract (ubuntu-latest)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: backend/Directory.Packages.props

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/tools/backend-api-contract/requirements.txt

      - name: Install contract validation dependencies
        run: python3 -m pip install -r backend/tools/backend-api-contract/requirements.txt

      - name: Verify frozen contract matches current source and CLR metadata
        run: python3 backend/tools/backend-api-contract/freeze.py --check

      - name: Validate frozen OpenAPI, schemas, examples, and manifest
        run: python3 backend/tools/backend-api-contract/validate.py

  integration:
    name: Frontend Integration (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.run_integration == true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'linux' && '["ubuntu-latest"]' || (inputs.platform == 'windows' && '["windows-latest"]' || '["ubuntu-latest", "windows-latest"]')) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: backend/Directory.Packages.props

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install integration dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            pkg-config \
            libsystemd-dev \
            ffmpeg \
            fonts-noto-cjk \
            fonts-noto-color-emoji \
            fonts-dejavu-core \
            libfontconfig1 \
            libfreetype6

      - name: Install integration dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Build matched web and backend (Linux)
        if: runner.os == 'Linux'
        env:
          MakoMediaPresentationEnabled: 'false'
        run: pnpm run build

      - name: Build matched web and backend (Windows)
        if: runner.os == 'Windows'
        run: pnpm run build

      - name: Run frontend integration tests
        run: pnpm --dir frontend run test:integration
