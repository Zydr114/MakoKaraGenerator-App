<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MakoKara · UI 交互原型</title>
<style>
:root{color-scheme:light;--bg:#f4f5f8;--surface:#fff;--text:#202431;--muted:#626b7b;--edge:#e0e4ed;--accent:#365ecc;--soft:#eaf0ff}
*{box-sizing:border-box}body{margin:0;font:14px/1.6 system-ui,"Noto Sans CJK SC",sans-serif;background:var(--bg);color:var(--text)}body.dark{color-scheme:dark;--bg:#171a22;--surface:#212630;--text:#e8edf7;--muted:#a8b2c6;--edge:#353d4f;--accent:#9bb8ff;--soft:#2a395e}
button,input,select,textarea{font:inherit;color:inherit}button{border:1px solid var(--edge);border-radius:8px;padding:7px 14px;background:var(--surface);cursor:pointer}button:hover,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}button.active,.primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}input,select,textarea{border:1px solid var(--edge);border-radius:7px;background:var(--surface);padding:7px 10px;max-width:100%}textarea{width:100%;resize:vertical}h1,h2,h3,p{margin:0}h1{font-size:30px}h2{font-size:21px}h3{font-size:15px}.muted,small{color:var(--muted)}.bar,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spread{justify-content:space-between}.bar{padding:10px 18px;border-bottom:1px solid var(--edge);background:var(--surface)}.badge{border-radius:6px;background:var(--soft);padding:3px 9px;font-size:12px}.card{border:1px solid var(--edge);border-radius:12px;background:var(--surface);padding:18px}.stack>*+*{margin-top:14px}.home{max-width:1040px;margin:56px auto;padding:0 26px;display:grid;grid-template-columns:210px 1fr;gap:35px}.rail button{width:100%;text-align:left;margin-bottom:10px}.hero{padding:30px;background:var(--soft);border-radius:14px}.recent{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.recent button{text-align:left;padding:22px}.shell{height:calc(100dvh - 45px);min-height:595px;display:flex;flex-direction:column}.tabs{padding:10px 18px;display:flex;flex-wrap:wrap;gap:8px}.work{flex:1;min-height:180px;display:grid;grid-template-columns:minmax(280px,1fr) 330px;gap:14px;padding:0 18px 12px;position:relative}.central{overflow:auto;min-width:0}.aside{overflow:auto;min-width:0}.lyrics .line{padding:12px 15px;border-bottom:1px solid var(--edge)}.line.selected{background:var(--soft);border-radius:10px}.linehead{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center}.linehead button{text-align:left;border:0;background:transparent;padding:0;font-size:16px}.chips span{display:inline-block;margin:3px;padding:5px 10px;background:var(--surface);border-radius:5px}.canvas{background:#101a35;min-height:260px;aspect-ratio:16/9;display:grid;place-content:center;text-align:center;color:#f5f7ff;border-radius:8px}.canvas .song{font-size:clamp(24px,3vw,44px);color:#91c6ff}.canvas .annotation{font-size:17px;letter-spacing:4px}.canvas small{color:#adbde3}.fields{display:grid;grid-template-columns:85px 1fr;gap:9px;align-items:center}.layout button{flex:1}.layout b{display:block;letter-spacing:5px;font-size:17px}.transport{padding:10px 18px;border-top:1px solid var(--edge);background:var(--surface)}.wave{position:relative;height:90px;margin:0 18px;background:repeating-linear-gradient(90deg,transparent 0 24px,var(--edge) 25px 26px),var(--surface);overflow:hidden;border:1px solid var(--edge);border-radius:8px}.wave svg{width:100%;height:62px}.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);left:27%}.ruler{position:absolute;bottom:3px;left:10px;right:10px;display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.status{font-size:12px;padding:5px 18px;display:flex;gap:15px;color:var(--muted)}.advanced{display:grid;grid-template-columns:210px 1fr;gap:15px}.tree{border:1px solid var(--edge);padding:14px;border-radius:8px}.tree p{padding:8px}.tree .child{margin-left:15px}.advanced textarea{min-height:180px;font-family:monospace}details{border-top:1px solid var(--edge);padding-top:10px}summary{cursor:pointer}.hidden{display:none!important}.mobile-panel{display:none}dialog{background:var(--surface);color:var(--text);border:1px solid var(--edge);border-radius:14px;padding:28px;width:min(470px,90vw)}dialog::backdrop{background:#10162488}.demo-bar{height:45px;padding:7px 18px;background:var(--soft);display:flex;justify-content:space-between;align-items:center;font-size:12px}.demo-bar button{padding:2px 10px;font-size:12px}.guide{font-size:12px}.draft{color:var(--accent)}
@media(max-width:1099px){.work{grid-template-columns:minmax(280px,1fr)}.aside{display:none}.aside.open{display:block;position:absolute;right:18px;top:0;bottom:12px;width:min(330px,calc(100% - 36px));box-shadow:0 12px 40px #10162444;z-index:2}.mobile-panel{display:inline-block}.advanced{grid-template-columns:170px 1fr}}
@media(max-width:760px){.home{grid-template-columns:1fr;margin:26px auto;gap:16px}.rail{display:flex;gap:10px}.rail button{width:auto}.recent{grid-template-columns:1fr}.bar{padding:8px 12px}.tabs{padding:8px 12px}.work{padding:0 12px 10px}.advanced{grid-template-columns:1fr}.tree{display:none}.titlepath{display:none}.status{flex-wrap:wrap;gap:4px}.wave{margin:0 12px}.hero{padding:20px}}
</style>
<div class="demo-bar"><span>交互原型 · 页面与操作为模拟，未连接工程或成片</span><button id="theme">切换深浅主题</button></div>
<div id="home" class="home">
 <nav class="rail"><h2 style="margin-bottom:25px">MakoKara</h2><button class="primary" id="new">＋ 新建工程</button><button id="open">打开工程…</button><button id="recover">恢复备份…</button></nav>
 <main class="stack"><div class="hero stack"><span class="badge">逐字歌词制作</span><h1>从歌词开始制作</h1><p class="muted">导入歌词 → 打轴 → 调整画面 → 导出</p><button id="new-hero" class="primary">新建工程</button></div><div class="row spread"><h2>最近工程</h2><small>成功打开或保存后更新</small></div><div class="recent"><button data-enter>瑠璃の鳥<br><small>今天 14:32 · 1920×1080</small></button><button data-enter>新歌制作<br><small>昨天 20:15 · 1280×720</small></button></div><details><summary>无法打开的工程</summary><p class="muted">缺失路径显示“文件不存在”；版本不一致显示所需版本；损坏文件保留完整诊断。原文件保持完整。</p></details></main>
</div>
<div id="editor" class="shell hidden">
 <header class="bar spread"><div class="row"><button id="back">⌂ 首页</button><strong id="project-name">未命名工程</strong><span id="save-status" class="badge">尚未保存</span></div><div class="row"><button id="save">保存</button><button id="undo">撤销</button><button id="redo">重做</button><button id="export" class="primary">导出</button></div></header>
 <nav class="tabs" id="tabs"><button data-task="lyrics" class="active">歌词与打轴</button><button data-task="picture">画面与样式</button><button id="advanced-menu">＋ 高级工作区</button><button id="panel" class="mobile-panel">辅助面板</button></nav>
 <div class="work"><main id="central" class="central card"></main><aside id="aside" class="aside card stack"></aside></div>
 <div class="transport row spread"><div class="row"><button id="play" class="primary">▶ 播放</button><span>00:12.400 / 00:57.000</span><button id="loop">循环选区</button></div><span class="guide muted">J/K/L 播放 · 空格暂停 · S 拆分 · M 合并</span></div>
 <div class="wave"><svg viewBox="0 0 1000 60" preserveAspectRatio="none"><path id="wavepath" stroke="#6b92e6" stroke-width="2" fill="none"/></svg><div class="playhead"></div><div class="ruler"><span>00:00</span><span>00:10</span><span>00:20</span><span>00:30</span><span>00:40</span><span>00:50</span></div></div>
 <footer class="status"><span id="feedback">准备就绪</span><details><summary>诊断</summary>正式会话状态、错误和透明回退报告可在这里展开。</details></footer>
</div>
<dialog id="modal"><div id="dialog-body" class="stack"></div></dialog>
<script>
const $=id=>document.getElementById(id);let task='lyrics',openTasks=[],scope='整首歌词';const drafts=new Set();const labels={lyrics:'歌词与打轴',picture:'画面与样式',scene:'高级编排',templates:'预设制作',effects:'效果编辑'};
function feedback(text){$('feedback').textContent=text}
function dialog(html){$('dialog-body').innerHTML=html;$('modal').showModal()}
function dismiss(){$('modal').close()}
function enter(name){$('project-name').textContent=name||'未命名工程';$('home').classList.add('hidden');$('editor').classList.remove('hidden');render('lyrics')}
function newProject(){dialog('<h2>新建工程</h2><label>工程名称 <input id="name" value="未命名工程"></label><div class="fields"><span>画布</span><select><option>1920 × 1080</option><option>1280 × 720</option></select><span>帧率</span><select><option>30 fps</option><option>60 fps</option></select></div><div class="row"><button onclick="dismiss()">取消</button><button class="primary" onclick="enter($(\'name\').value);dismiss()">创建工程</button></div>')}
$('new').onclick=$('new-hero').onclick=newProject;$('open').onclick=()=>enter('打开的工程');document.querySelectorAll('[data-enter]').forEach(b=>b.onclick=()=>enter(b.firstChild.textContent));
$('recover').onclick=()=>dialog('<h2>恢复未保存的现场</h2><p>瑠璃の鳥 · 今天 14:30</p><p class="muted">未选择或恢复失败时保留现场。恢复后可另存为新工程。</p><div class="row"><button onclick="dismiss()">取消</button><button class="primary" onclick="enter(\'瑠璃の鳥（恢复）\');dismiss()">恢复</button></div>');
$('theme').onclick=()=>document.body.classList.toggle('dark');$('panel').onclick=()=>$('aside').classList.toggle('open');$('back').onclick=()=>leave(()=>{$('editor').classList.add('hidden');$('home').classList.remove('hidden')});
function leave(action,targets=[...openTasks]){if(!targets.some(t=>drafts.has(t))){action();return}dialog('<h2>处理工作区草稿</h2><p>基础任务切换保留草稿；关闭工作区或换工程时处理它。</p><div class="row"><button onclick="dismiss()">取消</button><button id="discard">放弃</button><button id="apply" class="primary">应用／保存</button></div>');$('discard').onclick=()=>{targets.forEach(t=>drafts.delete(t));dismiss();action()};$('apply').onclick=()=>{targets.forEach(t=>drafts.delete(t));feedback('已应用／保存草稿');dismiss();action()}}
function markDraft(){drafts.add(task);feedback(labels[task]+' · 未提交草稿（切换任务保留）')}
function closeTask(next){leave(()=>{let b=document.querySelector('[data-task="'+next+'"]');if(b)b.parentElement.remove();openTasks=openTasks.filter(t=>t!==next);render('picture')},[next])}function addTask(next){if(!openTasks.includes(next)){openTasks.push(next);let group=document.createElement('span');group.className='row';let b=document.createElement('button');b.dataset.task=next;b.textContent=labels[next];b.onclick=()=>render(next);let close=document.createElement('button');close.textContent='×';close.setAttribute('aria-label','关闭'+labels[next]);close.onclick=()=>closeTask(next);group.append(b,close);$('tabs').insertBefore(group,$('advanced-menu'))}render(next)}
$('advanced-menu').onclick=()=>dialog('<h2>高级工作区</h2><button onclick="dismiss();addTask(\'scene\')">高级编排 · 布局与歌词段</button><button onclick="dismiss();addTask(\'templates\')">预设制作 · 模板与资源</button><button onclick="dismiss();addTask(\'effects\')">效果编辑 · 参数与源码</button><button onclick="dismiss()">取消</button>');
document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>render(b.dataset.task));
const commonDetails='<details><summary>渐变、材质与效果参数</summary><p class="muted">渐变详细参数、包材质、九类参数和相关实例在此展开。</p><button onclick="addTask(\'effects\')">编辑相关效果</button></details>';
function render(next){task=next;$('aside').classList.remove('open');document.querySelectorAll('[data-task]').forEach(b=>b.classList.toggle('active',b.dataset.task===next));let c='',a='';
if(next==='lyrics'){c='<div class="stack lyrics"><div class="row spread"><h2>歌词与打轴</h2><div class="row"><button onclick="feedback(\'导入歌词：格式识别后预览\')">导入歌词</button><button onclick="dialog(\'<h2>粘贴歌词</h2><textarea rows=5></textarea><button onclick=dismiss()>导入</button>\')">粘贴</button><button onclick="feedback(\'更多：歌词来源、关联、翻译与导出\')">更多</button></div></div><div class="line"><div class="linehead"><small>01</small><button>瑠璃の空に　夢を描いて</button><small>已校正 · 00:04.200</small></div></div><div class="line selected stack"><div class="linehead"><small>02</small><button>光を追いかけて　羽ばたく</button><small>估算 · 00:12.000</small></div><textarea rows="2" aria-label="当前行文字" oninput="feedback(\'行文字编辑：合法值即时更新，失焦合并一次撤销\')">光を追いかけて　羽ばたく</textarea><div class="chips"><span>光</span><span>を</span><span>追</span><span>い</span><span>か</span><span>け</span><span>て</span><span>羽</span><span>ば</span><span>た</span><span>く</span></div><div class="row"><button onclick="feedback(\'按字素拆分：打开切分配置\')">拆分</button><button onclick="feedback(\'合并选中元素\')">合并</button><button onclick="feedback(\'当前行注音与翻译\')">注音／翻译</button><button onclick="feedback(\'整行独立起止时间\')">行时间</button></div></div><div class="line"><div class="linehead"><small>03</small><button>いつか届く　遠いあの場所へ</button><small>未打轴</small></div></div><button onclick="feedback(\'添加歌词行\')">＋ 添加行</button><details><summary>成片预览</summary><div class="canvas"><p class="song">光を追いかけて</p></div></details></div>';a='<h3>所选文字 · 光</h3><span class="badge">估算时间</span><div class="fields"><label for="start">起点</label><input id="start" value="00:12.000"><label for="end">终点</label><input id="end" value="00:12.420"></div><div class="row"><button>−10 ms</button><button>＋10 ms</button><button class="primary">校正</button></div><p class="muted">拖动底部时间块调整时间；选中后按空格试听。循环范围保持在共享播放器中。</p><button onclick="feedback(\'导入音频，保留歌词当前时间\')">导入音频</button><details><summary>音频分析</summary>显示未分析／可用／失败，接受分析后进入同一历史。</details>'}
if(next==='picture'){c='<div class="stack"><div class="row spread"><h2>画面与样式</h2><span class="badge">正式成片画布</span></div><div class="canvas"><p class="annotation">ひかり</p><p class="song">光を追いかけて　羽ばたく</p><small>00:12.400</small></div><div class="card stack"><div class="row spread"><h3>布局预设</h3><button onclick="addTask(\'scene\')">高级编排</button></div><div class="row layout"><button onclick="layout(\'单行\')"><b>━</b>单行</button><button onclick="layout(\'双行轮换\')"><b>━<br>━</b>双行轮换</button><button onclick="layout(\'三行\')"><b>≡</b>三行</button></div><button onclick="layout(\'所选歌词段\')">设置所选歌词段布局</button><small>复杂结构显示“自定义布局”，替换前展示受影响行段与引用。</small></div></div>';a='<h3>修改范围</h3><select id="scope"><option>整首歌词</option><option>当前行 · 第2行</option><option>所选文字 · 光</option></select><p id="target-label" class="badge">'+scope+'</p><small>已有局部覆盖仍优先；在所选目标恢复继承。</small><div class="fields"><span>字体</span><select><option>Noto Sans CJK SC</option></select><span>字号</span><input value="64" type="number"><span>未唱颜色</span><input type="color" value="#f4f6ff"><span>已唱颜色</span><input type="color" value="#91c6ff"><span>描边</span><input value="2.0" type="number"><span>阴影</span><select><option>开启</option><option>关闭</option></select><span>位置</span><input value="画布底部 · 75%"></div><button onclick="feedback(\'当前目标恢复继承：一次撤销\')">恢复继承</button>'+commonDetails+'<details><summary>工程与背景</summary><p>画布／帧率／时长／底色／图片／视频</p></details>';}
if(['scene','templates','effects'].includes(next)){c='<div class="stack"><div class="row spread"><h2>'+labels[next]+'</h2><button onclick="closeTask(task)">关闭工作区</button></div><p class="draft">'+(drafts.has(next)?'未提交草稿':'草稿工作区 · 显式应用／保存')+'</p>';
if(next==='scene'){c+='<div class="row"><button class="primary">1 设置布局</button><button>2 分配歌词段</button><button>3 时间预览</button></div><div class="advanced"><div class="tree"><p>歌曲布局</p><p class="child">轮换容器</p><p class="child">└ 槽位 1</p><p class="child">└ 槽位 2</p><details><summary>完整容器树</summary>组、标记、前奏节点与片段</details></div><div class="stack"><div class="canvas"><p class="song">光を追いかけて</p></div><button onclick="markDraft()">分配第 1–6 行到双行轮换</button><button onclick="markDraft()">分析前奏候选…</button></div></div>';a='<h3>双行轮换 · 容器</h3><p>先设置槽位布局，再分配歌词段。</p><button onclick="markDraft()">调整槽位位置</button><details><summary>片段绑定与完整参数</summary>目标、时间范围、稳定引用和优先级</details>'}
if(next==='templates'){c+='<div class="row"><button>我的预设</button><button>新建预设</button><button>导入 .mktpl</button><button>分享 .mktpl</button></div><div class="canvas"><p class="song">预设正式试样</p></div><button onclick="markDraft()">编辑行模板／元素族配方</button>';a='<h3>预设制作</h3><p>静态属性、源材质、相对配方与完整资源闭包。</p><button onclick="markDraft()">修改配方参数</button>'+commonDetails}
if(next==='effects'){c+='<div class="row"><button>相关实例</button><button>包资源</button><button>导入／分享 .mkfx</button></div><div class="card stack"><h3>WordEmphasis · 第2行</h3><label>放大比例 <input value="1.15" oninput="markDraft()"></label><button onclick="markDraft()">保存工程改动</button></div><details><summary>源码与编译诊断</summary><textarea oninput="markDraft()">public void Evaluate(FrameContext frame)\n{\n    // 作者源码草稿\n}</textarea><div class="row"><button onclick="feedback(\'独立编译，不自动接受修订\')">编译包</button><button onclick="markDraft()">接受所选实例修订</button></div><p class="muted">失败源码也可保存；正式运行验证单独执行。</p></details>';a='<h3>所选实例</h3><p>稳定目标 · 第2行</p><label><input type="checkbox"> 启用实例</label><details><summary>绑定、订阅、seed 与包修订</summary>完整作者参数与精确身份</details><button onclick="feedback(\'正式会话运行验证\')">验证工程效果</button>'}
c+='<div class="row"><button class="primary" onclick="drafts.delete(task);feedback(\'草稿已应用／保存\')">'+(next==='scene'?'应用编排':'保存改动')+'</button><button onclick="closeTask(task)">放弃／关闭</button></div></div>'}
$('central').innerHTML=c;$('aside').innerHTML=a;if($('scope')){$('scope').value=scope;$('scope').onchange=e=>{scope=e.target.value;$('target-label').textContent=scope;feedback('修改范围：'+scope)}}}
function layout(label){dialog('<h2>应用'+label+'布局</h2><p>影响范围：所选歌词段。复杂结构需要检查节点与关联引用。</p><div class="row"><button onclick="dismiss()">取消</button><button class="primary" onclick="feedback(\'布局作为一次可撤销事务应用\');dismiss()">应用</button></div>')}
$('save').onclick=()=>{$('save-status').textContent='已保存';feedback('工程保存成功；最近工程更新')};$('undo').onclick=()=>feedback('撤销上一完整编辑手势');$('redo').onclick=()=>feedback('重做上一完整编辑手势');$('play').onclick=()=>{$('play').textContent=$('play').textContent.includes('播放')?'Ⅱ 暂停':'▶ 播放'};$('loop').onclick=e=>{e.target.classList.toggle('active');feedback('循环选区状态在工作区切换后保留')};$('export').onclick=()=>dialog('<h2>导出成片</h2><select><option>普通视频 · MP4</option><option>透明视频 · ProRes4444</option></select><p class="muted">使用正式渲染会话；显示背景依赖回退报告，失败或取消保护旧产物。</p><div class="row"><button onclick="dismiss()">取消</button><button class="primary" onclick="feedback(\'模拟导出完成\');dismiss()">导出</button></div>');let points=[];for(let x=0;x<1000;x+=4){let amp=5+18*Math.abs(Math.sin(x*.031)*Math.cos(x*.009));points.push((x===0?'M':'L')+x+','+(30+(x%8===0?amp:-amp)))}$('wavepath').setAttribute('d',points.join(' '));
</script>
</html>
