# GitHub-hosted CI for the suites that do not need a GPU, a display, or a
# pre-published self-contained Server.
#
# Runner: ubuntu-24.04 (Linux x64). The desktop GPU path, Linux process
# guards, and several tests call /usr/bin/ffmpeg, /usr/bin/ffprobe, /bin/sleep,
# and /usr/share/fonts/noto-cjk/NotoSansCJK-Regular.ttc. Windows-only branches
# are already guarded with OperatingSystem.IsWindows(). A windows-latest
# job would cost twice the minutes and still could not run those paths.
#
# FFmpeg: ubuntu-24.04 ships 6.1 (libavformat 60). native/media-presentation
# requires libavformat>=63, libavcodec>=63 and libavutil>=61, which is FFmpeg 9.
# The documented toolchain is 9.0.2, and several tests call /usr/bin/ffmpeg by
# absolute path. The backend job builds that shared release with libx264,
# libmp3lame, libopus and libvorbis (the encoders tests name explicitly),
# points /usr/bin/ffmpeg and ffprobe at it, and registers the libraries with
# ldconfig. native/media-envelope also needs libsystemd-dev.
#
# GPU: hosted runners have no Vulkan device. Tests marked Category=GpuSmoke
# are excluded (they only assert real Vulkan pixels and return immediately
# unless MAKO_GPU_SMOKE=1). Other tests keep running: their CPU / Skia cases
# execute, and an inline gpu=true case returns before creating a device when
# MAKO_GPU_SMOKE is unset. That variable is intentionally not set here.
# MAKO_GPU_SMOKE=1 on a GPU-less runner would fail those cases.
#
# PublishedServer: RubyTimelineTransportTests needs a self-contained Server
# and Worker at artifacts/ttml-ruby/publish (or MAKO_RUBY_HTTP_*_PATH). That
# tree is gitignored and is not produced by `dotnet build` of the solution.
# The three facts are excluded so a missing publish is not reported as a
# product failure. See the PR description for the list.
#
# Not in this workflow:
# - frontend `test:integration` starts a real Server from `.local/backend-dist`
#   produced by `pnpm build` (self-contained publish). It is not `vitest` alone.
# - Electron windows are not launched. desktop/gpu-preview/*.test.cjs mocks
#   Electron, so xvfb is unnecessary.
# - scripts that drive a live GPU preview (pnpm preview:p0, smoke:desktop).

name: CI

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  MSBUILDDISABLENODEREUSE: "1"
  # Do not opt into Vulkan. Empty is not "1"; the gates compare against "1".
  MAKO_GPU_SMOKE: ""

jobs:
  backend:
    name: backend (build + xUnit)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PKG_CONFIG_PATH: ${{ github.workspace }}/.ffmpeg/lib/pkgconfig
      LD_LIBRARY_PATH: ${{ github.workspace }}/.ffmpeg/lib
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fonts and native build packages
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            nasm \
            xz-utils \
            libsystemd-dev \
            libx264-dev \
            libmp3lame-dev \
            libopus-dev \
            libvorbis-dev \
            fontconfig \
            libfontconfig1 \
            fonts-dejavu-core \
            fonts-noto-cjk \
            fonts-noto-color-emoji
          font="$(find /usr/share/fonts -name 'NotoSansCJK-Regular.ttc' -print -quit)"
          if [[ -z "${font}" ]]; then
            echo "NotoSansCJK-Regular.ttc was not installed. Font files:"
            find /usr/share/fonts -iname '*noto*' -o -iname '*cjk*' | sort
            exit 1
          fi
          sudo mkdir -p /usr/share/fonts/noto-cjk
          if [[ "${font}" != /usr/share/fonts/noto-cjk/NotoSansCJK-Regular.ttc ]]; then
            sudo ln -sfn "${font}" /usr/share/fonts/noto-cjk/NotoSansCJK-Regular.ttc
          fi
          fc-cache -f
          test -f /usr/share/fonts/noto-cjk/NotoSansCJK-Regular.ttc
          pkg-config --exists libsystemd
          fc-list : family | grep -F 'Noto Sans CJK SC'
          fc-list : family | grep -F 'Noto Color Emoji'
          fc-list : family | grep -F 'DejaVu Sans'
          echo "noto: ${font}"

      # Distro ffmpeg on ubuntu-24.04 is 6.1. Cache the shared install so later
      # runs skip the compile. The prefix path is stable for this repository
      # on GitHub-hosted runners, which is what the installed libraries record.
      - name: Cache FFmpeg 9.0.2
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ffmpeg
          key: ffmpeg-9.0.2-shared-linux-x64-gpl-v2

      - name: Build FFmpeg 9.0.2
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/ffmpeg-9.0.2.tar.xz https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
          echo "8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e  /tmp/ffmpeg-9.0.2.tar.xz" | sha256sum -c -
          tar -xf /tmp/ffmpeg-9.0.2.tar.xz -C /tmp
          cd /tmp/ffmpeg-9.0.2
          # Tests and the exporter call libx264 (crf/preset), libmp3lame, libopus
          # and libvorbis by name. The native aac/flac/pcm/ffv1 encoders are
          # already in a default build; these four are external libraries.
          ./configure \
            --prefix="${GITHUB_WORKSPACE}/.ffmpeg" \
            --enable-shared \
            --disable-static \
            --disable-doc \
            --disable-debug \
            --disable-ffplay \
            --enable-gpl \
            --enable-libx264 \
            --enable-libmp3lame \
            --enable-libopus \
            --enable-libvorbis
          make -j"$(nproc)"
          make install
          test -x "${GITHUB_WORKSPACE}/.ffmpeg/bin/ffmpeg"
          test -f "${GITHUB_WORKSPACE}/.ffmpeg/lib/pkgconfig/libavformat.pc"

      - name: Expose FFmpeg 9.0.2
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          sudo ln -sfn "${GITHUB_WORKSPACE}/.ffmpeg/bin/ffmpeg" /usr/bin/ffmpeg
          sudo ln -sfn "${GITHUB_WORKSPACE}/.ffmpeg/bin/ffprobe" /usr/bin/ffprobe
          echo "${GITHUB_WORKSPACE}/.ffmpeg/lib" | sudo tee /etc/ld.so.conf.d/ffmpeg-9.conf >/dev/null
          sudo ldconfig
          python3 - <<'PY'
          import os
          import subprocess
          required = {"libavformat": 63, "libavcodec": 63, "libavutil": 61}
          for name, minimum in required.items():
              version = subprocess.check_output(["pkg-config", "--modversion", name], text=True).strip()
              major = int(version.split(".", 1)[0])
              print(f"{name} {version}")
              if major < minimum:
                  raise SystemExit(f"{name} {version} is older than {minimum}")
          for tool in ("/usr/bin/ffmpeg", "/usr/bin/ffprobe"):
              line = subprocess.check_output([tool, "-version"], text=True).splitlines()[0]
              print(line)
              if "9.0.2" not in line:
                  raise SystemExit(f"{tool} is not 9.0.2: {line}")
          encoders = subprocess.check_output(["/usr/bin/ffmpeg", "-hide_banner", "-encoders"], text=True)
          for name in ("libx264", "libmp3lame", "libopus", "libvorbis"):
              if name not in encoders:
                  raise SystemExit(f"ffmpeg is missing encoder {name}")
              print("encoder", name)
          print("PKG_CONFIG_PATH", os.environ.get("PKG_CONFIG_PATH"))
          PY

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-net10-${{ hashFiles('backend/**/*.csproj', 'backend/**/*.props', 'backend/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-net10-

      - name: Show SDK
        run: dotnet --info

      - name: Build
        run: dotnet build MakoKaraGenerator.slnx -c Debug --nologo

      - name: Test
        run: |
          set -euo pipefail
          # -m:1 runs one test project at a time. Several Skia projects allocate
          # full frames; overlapping them on a 4-core runner is the likely OOM.
          # Category!=GpuSmoke drops only the Vulkan-only facts/theories.
          # Category!=PublishedServer drops RubyTimelineTransportTests, which
          # asserts a pre-published self-contained Server/Worker exists.
          # Cases that merely return when MAKO_GPU_SMOKE is unset still run.
          dotnet test MakoKaraGenerator.slnx -c Debug --no-build --nologo -m:1 \
            --filter 'Category!=GpuSmoke&Category!=PublishedServer' \
            --logger 'console;verbosity=minimal' \
            --logger 'trx;LogFileName=results.trx'

      - name: Summarize test results
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          rows = []
          totals = {"total": 0, "passed": 0, "failed": 0, "skipped": 0}
          for path in sorted(glob.glob("backend/**/TestResults/results.trx", recursive=True)):
              root = ET.parse(path).getroot()
              counters = root.find("t:ResultSummary/t:Counters", ns)
              if counters is None:
                  continue
              project = Path(path).parents[1].name
              counts = {key: int(counters.get(key, "0")) for key in ("total", "passed", "failed")}
              # xUnit reports skipped tests as notExecuted.
              counts["skipped"] = int(counters.get("notExecuted", "0"))
              rows.append((project, counts))
              for key in totals:
                  totals[key] += counts[key]
          lines = ["### Backend xUnit", ""]
          if not rows:
              lines.append("No TRX files were written (the build or test host failed before a project finished).")
          else:
              lines.append("| Project | Total | Passed | Failed | Skipped |")
              lines.append("| --- | ---: | ---: | ---: | ---: |")
              for project, counts in rows:
                  lines.append(f"| {project} | {counts['total']} | {counts['passed']} | {counts['failed']} | {counts['skipped']} |")
              lines.append(f"| **Total** | **{totals['total']}** | **{totals['passed']}** | **{totals['failed']}** | **{totals['skipped']}** |")
          lines += [
              "",
              "Excluded from discovery, so they are not in the counts above:",
              "",
              "- `Category=GpuSmoke` (needs a Vulkan device; `MAKO_GPU_SMOKE` is unset)",
              "- `Category=PublishedServer` (needs a self-contained publish that `dotnet build` does not produce)",
          ]
          text = "\n".join(lines) + "\n"
          print(text)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write(text)
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-trx
          path: backend/**/TestResults/results.trx
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: frontend (typecheck + vitest unit)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Root package.json engines is ">=26". frontend/ has no engines field;
      # its @types/node is ^26 and the app docs pin Node 26. pnpm 11.7.0 is the
      # version recorded in the root README. The lockfile that installs
      # dependencies is frontend/pnpm-lock.yaml (lockfileVersion 9).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Show toolchain
        run: |
          node --version
          pnpm --version

      - name: Install
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir frontend typecheck

      # Unit tests use a fake fetch and do not start Server.
      # test:integration is intentionally not run: each file calls
      # startTestBackend(), which requires a self-contained publish under
      # .local/backend-dist from `pnpm build`.
      - name: Vitest unit
        run: pnpm --dir frontend test:unit

  node:
    name: node tests (desktop + app)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Show Node
        run: node --version

      # These files mock Electron or only parse launch strings. They do not
      # open a window, so xvfb and the Electron download are not required.
      # ordinary-exec.test.cjs checks Linux scheduler policy 0 / nice 0.
      - name: desktop/gpu-preview
        run: node --test desktop/gpu-preview/*.test.cjs

      - name: desktop host
        run: node --test tests/desktop-host.test.mjs

      - name: launcher
        run: node --experimental-test-module-mocks --test tests/launcher.test.mjs

      - name: gpu preview P3 math
        run: node --test scripts/gpu-preview-p3.test.mjs

      - name: gpu worker pool adapter
        run: node --test backend/tools/backend-gpu-worker-pool-acceptance/adapter-factory.test.cjs

  contract:
    name: HTTP contract (Release metadata + validate)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python venv support
        working-directory: ${{ github.workspace }}
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-venv python3-pip

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-net10-${{ hashFiles('backend/**/*.csproj', 'backend/**/*.props', 'backend/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-net10-

      - name: Python environment
        run: |
          set -euo pipefail
          python3 -m venv artifacts/api-contract/venv
          artifacts/api-contract/venv/bin/python -m pip install --disable-pip-version-check -r tools/backend-api-contract/requirements.txt

      # README: build the offline metadata tool in Release, export CLR facts,
      # then freeze.py in check mode (no --write) and validate.py. freeze.py
      # fails if the generated OpenAPI / index / examples / manifest bytes
      # differ from the committed files.
      - name: Release metadata and contract check
        run: |
          set -euo pipefail
          dotnet build tools/backend-api-contract/ContractMetadata.csproj -c Release --nologo
          mkdir -p artifacts/api-contract
          tools/backend-api-contract/bin/Release/net10.0/ContractMetadata artifacts/api-contract/clr-metadata.json
          python3 tools/backend-api-contract/freeze.py --metadata artifacts/api-contract/clr-metadata.json
          artifacts/api-contract/venv/bin/python tools/backend-api-contract/validate.py --report artifacts/api-contract/validation.json
